[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kopitar"
version = "1.0.0"
description = "NHL Player Performance and Fatigue Analysis Platform"
readme = "README.md"
license = {file = "LICENSE"}
authors = [
    {name = "Kopitar Team", email = "team@kopitar.dev"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Sports Analytics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.5",
    "redis>=4.5.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "jupyterlab>=4.0.3",
]
ml = [
    "xgboost>=1.7.0",
    "lightgbm>=3.3.5",
    "optuna>=3.2.0",
    "mlflow>=2.4.0",
    "shap>=0.42.0",
]
monitoring = [
    "prometheus-client>=0.17.0",
    "structlog>=23.1.0",
    "sentry-sdk>=1.28.0",
]

[project.urls]
"Homepage" = "https://github.com/kopitar-team/kopitar"
"Repository" = "https://github.com/kopitar-team/kopitar"
"Bug Tracker" = "https://github.com/kopitar-team/kopitar/issues"

[project.scripts]
kopitar = "kopitar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 88

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = [
    "--cov=src/kopitar",
    "--cov-report=html",
    "--cov-report=term-missing",
    "--strict-markers",
    "--continue-on-collection-errors",
]
markers = [
    "asyncio: mark test as async",
]

[tool.coverage.run]
source = ["src/kopitar"]
omit = ["*/tests/*", "*/test_*.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
]